name: CI

on:
  pull_request:
    # WHY: push-* = stacked PR bases (pi-jj stack flow) — each stacked PR
    # targets its parent branch, so CI must fire there, not only on main.
    branches: [main, 'push-*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.beads/**'
      - 'specs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.beads/**'
      - 'specs/**'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # One cache for every compiling job: they all build the same
          # workspace with the same flags, so per-job keys just multiplied
          # storage 5x until GitHub's 10GB eviction cold-missed them all.
          shared-key: ci
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --tests -- -D warnings

  test-game:
    name: Test (game)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - name: Test (game)
        run: cargo test --package game

  test-characters:
    name: Test (characters)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - name: Test (characters)
        # WHY: the multi-round loop (round_loop) and the combat brain tests
        # live here — without this job they ran only locally (PR 3, melee v2).
        run: cargo test --package characters

  test-shared:
    name: Test (shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - name: Test (shared)
        run: cargo test --package shared

  test-api:
    name: Test (api integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          # WHY: actions/cache skips a save when the key already exists, so
          # the fast jobs freeze `ci` at their small target dir (~189MB) and
          # this job's ~460-crate tree never lands — every run cold-built
          # 14+ minutes of deps while tests took ~6s (measured, bead fiz).
          # A distinct key segment gives api its own ~1GB entry; total
          # storage stays far under the 10GB budget that motivated
          # shared-key in the first place.
          key: api
          cache-on-failure: true
      - name: Test (api integration)
        # api/tests/common/mod.rs spins up an in-memory SurrealDB per test
        # and sets SURREAL_MIG_PATH exactly once via OnceLock,
        # so the integration suite is safe to run with default parallelism.
        run: cargo test --package api --tests

  css:
    # Rebuild the committed Tailwind artifact and fail on drift, so a
    # src/main.css edit without `just build-css` can't ship stale styles
    # green. Interim guard: bead gobblin-games-9g7 builds dist in the
    # pipeline and untracks it.
    name: CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild dist and require it committed in sync
        run: |
          cd api/assets
          npm install --silent
          npx @tailwindcss/cli -i ./src/main.css -o ./dist/main.css
          cd ../..
          git diff --exit-code api/assets/dist/ || {
            echo "::error::api/assets/dist/ is stale —" \
              "run 'just build-css' and commit the result."
            exit 1
          }

  quality:
    # Aggregate gate so branch protection can keep requiring a single
    # "Quality" status check while the real work fans out across jobs above.
    name: Quality
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-game, test-characters, test-shared, test-api, css]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ needs.fmt.result }}" != "success" ] \
             || [ "${{ needs.clippy.result }}" != "success" ] \
             || [ "${{ needs.test-game.result }}" != "success" ] \
             || [ "${{ needs.test-characters.result }}" != "success" ] \
             || [ "${{ needs.test-shared.result }}" != "success" ] \
             || [ "${{ needs.test-api.result }}" != "success" ] \
             || [ "${{ needs.css.result }}" != "success" ]; then
            echo "One or more required jobs failed:"
            echo "  fmt:         ${{ needs.fmt.result }}"
            echo "  clippy:      ${{ needs.clippy.result }}"
            echo "  test-game:   ${{ needs.test-game.result }}"
            echo "  test-characters: ${{ needs.test-characters.result }}"
            echo "  test-shared: ${{ needs.test-shared.result }}"
            echo "  test-api:    ${{ needs.test-api.result }}"
            echo "  css:         ${{ needs.css.result }}"
            exit 1
          fi
