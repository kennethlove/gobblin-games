[package]
name = "world"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fake = "5.1.0"
indefinite = "0.1.11"
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
# WHY: de_cure_kind in items/mod.rs round-trips the SurrealDB null through
# serde_json::Value; already in the workspace (api, dev-deps here), so this
# only widens visibility, no new crate.
serde_json = "1.0.149"
shared = { path = "../shared" }
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4", "js", "serde"] }

[dev-dependencies]
rstest = "0.26"
