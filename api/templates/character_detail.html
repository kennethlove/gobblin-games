{% extends "base.html" %}
{% block content %}
<div class="container page-body">
  <a href="/games/{{ game_id }}" class="back-link">Back to Game</a>
  {{ character_detail_html | safe }}
  {% if pending_advancements > 0 %}
  <form class="panel advance-form" method="post"
        action="/characters/{{ character_id }}/advance">
    <h3>{{ pending_advancements }} unspent advancement{% if pending_advancements != 1 %}s{% endif %}</h3>
    <div class="form-row">
      <label class="field-group">Stat
        <select name="stat">
          <option value="strength">Strength</option>
          <option value="toughness">Toughness</option>
          <option value="luck">Luck</option>
        </select>
      </label>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="btn">Spend</button>
    </div>
  </form>
  {% endif %}
</div>
{% endblock %}
