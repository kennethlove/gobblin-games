{% extends "base.html" %}
{% block content %}
<div class="container page-body" hx-ext="sse" sse-connect="/api/games/{{ game_id }}/events">
  <a href="/games/{{ game_id }}" class="back-link">Back to Game</a>
  <div class="page-header">
    <h1>Game Log</h1>
  </div>

  <div id="log-entries"
    class="log-container"
    hx-trigger="{{ sse_events | default(value='sse:*') }}"
    hx-get="/games/{{ game_id }}/log"
    hx-target="#log-entries"
    hx-swap="innerHTML">
    {% if event_cards | length == 0 %}
      <p class="empty-state">No messages yet.</p>
    {% else %}
      {{ event_cards | safe }}
    {% endif %}
  </div>
</div>
{% endblock %}
