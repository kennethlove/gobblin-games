<article class="event-card commentary" data-archetype="commentary">
  <header class="card-head">
    <span class="card-badge">ANALYSIS</span>
    <span class="card-timestamp">Day {{ day }} {{ phase }}</span>
  </header>
  <div class="card-body">
    <div class="comment-text">{% for line in lines %}<p>{{ line }}</p>{% endfor %}</div>
    <footer class="comment-speaker">
      <div class="speaker-avatar" aria-hidden="true">C</div>
      <div class="speaker-info">
        <span class="speaker-name">{{ speaker }}</span>
        <span class="speaker-role">ANALYSIS</span>
      </div>
    </footer>
  </div>
</article>
