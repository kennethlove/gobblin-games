<article class="event-card {{ archetype }}" data-archetype="{{ archetype }}" data-kind-color="{{ color }}">
  <header class="card-head">
    <span class="card-badge">{{ badge }}</span>
    <time class="card-timestamp">{{ ts }}</time>
  </header>
  <div class="card-body">
    <span class="card-kind">{{ kind }}</span>
    — {{ content }}
  </div>
</article>
