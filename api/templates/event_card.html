<div class="event-card {{ archetype }}" data-archetype="{{ archetype }}" style="border-left-color:{{ color }};">
  <div class="card-head">
    <span class="card-badge" style="background:{{ color }};">{{ badge }}</span>
    <span class="card-timestamp">{{ ts }}</span>
  </div>
  <div class="card-body">
    <span style="font-weight:600;">{{ kind }}</span>
    — {{ content }}
  </div>
</div>
