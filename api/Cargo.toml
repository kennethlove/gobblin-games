[package]
name = "api"
version = "0.1.15"
edition = "2024"

[dependencies]
announcers = { path = "../announcers" }
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
base64-url = "3.0.3"
# WHY: hash player emails into stable, one-way DiceBear avatar seeds —
# stdlib has no hash; blake3 is already in the lock (transitive).
blake3 = "1"
# WHY: render avatars in-process (user instruction: Rust library, not the
# HTTP API) — core parses+renders deterministic SVG, styles crate ships
# only the style definitions, one feature per embedded style.
dicebear-core = "10"
dicebear-styles = { version = "10", features = ["avataaars-neutral", "critters"] }
chrono = { version = "0.4.44", features = ["serde"] }
confirm-email = "0.1"
futures = "0.3.32"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
resend-rs = "0.25"
rand = "0.10"
game = { path = "../game" }
areas = { path = "../areas" }
characters = { path = "../characters" }
jsonwebtoken = { version = "10.0", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
askama_escape = "0.13"
tera = { version = "2", features = ["glob_fs"] }
shared = { path = "../shared" }
world = { path = "../world" }
strum = { version = "0.28", features = ["derive"] }
surrealdb = "3.1.2"
surrealdb-types = "3.1.2"
# WHY: reuse the S3 client already in this tree (transitive via
# surrealdb-core 3.1.3) for the upload backend (cxi -> Cloudflare R2) —
# no second S3-compatible client crate.
object_store = { version = "0.13", features = ["aws"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-cron-scheduler = "0.15"
tokio-stream = { version = "0.1", features = ["sync"] }
# WHY: parse the create-game form body's repeated keys by hand —
# serde_urlencoded's derive rejects sequence fields (see
# routes/games.rs::split_character_field). Already in the lock.
serde_urlencoded = "0.7"
url = "2.5"
tower-http = { version = "0.6.8", features = ["trace", "cors", "fs", "normalize-path"] }
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower_governor = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.1", features = ["v4"] }
time = { version = "0.3.47", features = ["serde", "macros"] }
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
axum-test = "20.0.0"
tokio-tungstenite = "0.29"
surrealdb = { version = "3.1.2", features = ["kv-mem"] }

[target.'cfg(windows)'.dependencies]
surrealdb = { version = "3.1.2", features = ["kv-mem"] }

[target.'cfg(unix)'.dependencies]
surrealdb = { version = "3.1.2", features = ["kv-surrealkv"] }
